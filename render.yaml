# Render.com Infrastructure-as-Code Blueprint (Docker)
# Deploy with: "New > Blueprint" in Render dashboard, point to this repo.
# Uses a single Docker Web Service running both API and WS via supervisord.

services:
  - type: web
    name: pmml-hospital-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: MONGO_URI
        sync: false  # Set manually in Render dashboard with your MongoDB Atlas URI
      - key: MONGO_DB
        value: pmml_hospital
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: "86400"
      - key: APP_URL
        fromService:
          name: pmml-hospital-backend
          type: web
          property: host
      - key: WS_PORT
        value: "8001"
      - key: WS_TCP_PORT
        value: "8002"
      - key: WS_INTERNAL_HOST
        value: "127.0.0.1"
      - key: UPLOAD_PATH
        value: ./uploads/certs/
