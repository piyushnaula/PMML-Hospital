# Render.com Infrastructure-as-Code Blueprint (Docker)
# Deploy with: "New > Blueprint" in Render dashboard, point to this repo.
# Uses a single Docker Web Service running API + internal WS via supervisord.

services:
  - type: web
    name: pmml-hospital-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      # ─── REQUIRED: Set these in Render Dashboard ───────────────
      - key: MONGO_URI
        sync: false  # Set manually with your MongoDB Atlas connection string
      - key: MONGO_DB
        value: pmml_hospital
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: "86400"

      # ─── CORS: Your Vercel frontend URL(s), comma-separated ────
      # Example: https://pmml-hospital.vercel.app,https://your-custom-domain.com
      - key: ALLOWED_ORIGINS
        sync: false  # Set manually to your Vercel frontend URL

      # ─── Internal config (usually no changes needed) ───────────
      - key: WS_PORT
        value: "8001"
      - key: WS_TCP_PORT
        value: "8002"
      - key: WS_INTERNAL_HOST
        value: "127.0.0.1"
      - key: UPLOAD_PATH
        value: "./uploads/certs/"
