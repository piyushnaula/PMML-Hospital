[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; ── HTTP API Server ──────────────────────────────────────────────
; Render assigns a dynamic $PORT (typically 10000). The API MUST listen on it.
[program:api]
command=/bin/sh -c "php -S 0.0.0.0:${PORT:-8000} index.php"
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Internal WebSocket Server ────────────────────────────────────
; Runs on a fixed internal port (8001). NOT exposed externally on Render.
; Used for internal TCP push from QueueService within the same container.
; On Render free tier, external WS connections won't work — this is expected.
[program:websocket]
command=php websocket/Server.php
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
